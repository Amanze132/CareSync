<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareSync EHR</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="login-container">

    <div class="logo">💙</div>

    <h1>CareSync EHR</h1>

    <p class="subtitle">
        Secure Healthcare Management System
    </p>
<label class="field-label">Organization</label>

<select id="organization">

    <option>Select Organization</option>

    <option>Manze Hospital</option>

    <option>St. Gabriel Hospital</option>

    <option>Joy Hospital</option>

    <option>Hope Home Healthcare</option>

</select>
    <input
        type="email"
        placeholder="Email Address">

    <input
        type="password"
        placeholder="Password">

    <div class="options">

        <label>
            <input type="checkbox">
            Remember Me
        </label>

        <a href="#">Forgot Password?</a>

    </div>

    <button>
        Sign In
    </button>

    <p class="footer">
        © 2026 CareSync Technologies
    </p>

<script src="script.js"></script>
</body>
</html>
