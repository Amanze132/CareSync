<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Organization</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

<h1>🏥 Register Organization</h1>

<input id="orgName" type="text" placeholder="Organization Name">

<input id="hospitalType" type="text" placeholder="Hospital Type">

<input id="country" type="text" placeholder="Country">

<input id="state" type="text" placeholder="State">

<input id="address" type="text" placeholder="Address">

<input id="email" type="email" placeholder="Official Email">

<input id="phone" type="tel" placeholder="Phone Number">

<button id="saveOrganization">
Register Organization
</button>

<br><br>

<button onclick="window.location.href='dashboard.html'">
Back to Dashboard
</button>

</div>

<script src="organization.js"></script>

</body>
</html>
